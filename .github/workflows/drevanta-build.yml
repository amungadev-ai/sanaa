name: Drevanta build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sanaa-drevanta .
      - name: Smoke test the standalone server
        run: |
          docker run -d --name sanaa-smoke -p 127.0.0.1:8080:8080 sanaa-drevanta
          trap 'docker logs sanaa-smoke; docker rm -f sanaa-smoke' EXIT
          curl --fail --retry 10 --retry-all-errors --max-time 5 http://127.0.0.1:8080/robots.txt | grep -F 'Sitemap:'
      - name: Check the homepage with MySQL
        run: |
          set -euo pipefail
          network=sanaa-ci
          database=sanaa-ci-mysql
          app=sanaa-ci-app
          cleanup() {
            if docker inspect "$app" >/dev/null 2>&1; then
              docker logs --tail 60 "$app" || true
              docker rm -f "$app" >/dev/null || true
            fi
            if docker inspect "$database" >/dev/null 2>&1; then
              docker logs --tail 30 "$database" || true
              docker rm -fv "$database" >/dev/null || true
            fi
            docker network rm "$network" >/dev/null || true
          }
          trap cleanup EXIT
          docker network create "$network"
          docker run -d --name "$database" --network "$network" \
            --memory 768m --memory-swap 768m --pids-limit 128 --security-opt no-new-privileges \
            -e MYSQL_DATABASE=sanaa -e MYSQL_ROOT_PASSWORD=fixture-root \
            -e MYSQL_USER=sanaa -e MYSQL_PASSWORD=fixture-app mysql:8
          ready=false
          for attempt in {1..35}; do
            test "$(docker inspect -f '{{.State.Running}}' "$database")" = true
            if docker exec -e MYSQL_PWD=fixture-app "$database" \
              mysql --protocol=tcp -h 127.0.0.1 -usanaa -D sanaa -se 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          DATABASE_URL="mysql://sanaa:fixture-app@$database:3306/sanaa"
          NEXTAUTH_SECRET=ci-fixture-secret-for-smoke-test
          export DATABASE_URL NEXTAUTH_SECRET
          docker run -d --name "$app" --network "$network" \
            --memory 512m --memory-swap 512m --pids-limit 256 --security-opt no-new-privileges \
            -p 127.0.0.1:8080:8080 -e DATABASE_URL -e NEXTAUTH_SECRET \
            -e NEXTAUTH_URL=http://127.0.0.1:8080 sanaa-drevanta
          curl --fail --retry 10 --retry-all-errors --max-time 5 http://127.0.0.1:8080/robots.txt >/dev/null
          before=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          echo "Homepage with an empty MySQL database: HTTP $before"

          docker build --target build -t sanaa-schema-tool .
          docker run --rm --network "$network" -e DATABASE_URL sanaa-schema-tool \
            ./node_modules/.bin/prisma db push --skip-generate
          curl --fail --show-error --silent --max-time 15 http://127.0.0.1:8080/ -o /tmp/sanaa-home.html
          grep -q 'Sanaa Through My Lens' /tmp/sanaa-home.html
          echo 'Homepage with the Prisma schema installed: HTTP 200'
